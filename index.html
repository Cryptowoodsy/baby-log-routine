function routinePageBar(title,back){let fav=localStorage.getItem('harry-routine-favourite-v1')==='1';return '<div class="routine-pagebar"><button type="button" class="routine-back" data-routine-back="'+esc(back||'home')+'" aria-label="Back">‹</button><h2>'+esc(title)+'</h2><button type="button" class="routine-heart '+(fav?'on':'')+'" data-routine-favourite aria-label="Favourite">'+(fav?'♥':'♡')+'</button></div>'}
function routineTabs(){return '<div class="routine-tabs" role="tablist">'+['overview','plan','tips','problems'].map(function(k){return '<button type="button" class="routine-tab '+(routinePanel===k?'on':'')+'" data-routine-panel="'+k+'">'+({overview:'Overview',plan:'Daily Plan',tips:'Tips',problems:'Problems'}[k])+'</button>'}).join('')+'</div>'}
function routineOverview(p){let i=routinePhaseIndex(p),glance=routineGlanceData[i];return '<h3 class="routine-section-title">At a glance</h3><div class="routine-glance">'+glance.map(function(x,n){return '<div class="routine-glance-row"><span class="routine-event-icon '+(['tone-mint','event-nap','tone-moon','event-bath','tone-sun'][n])+'">'+x[0]+'</span><div><b>'+esc(x[1])+': </b><span>'+esc(x[2])+'</span></div></div>'}).join('')+'</div><div class="routine-focus"><h3>Key focus this phase</h3>'+p.tips.slice(0,5).map(function(x){return '<div class="routine-check"><i>✓</i><span>'+esc(x)+'</span></div>'}).join('')+'</div><button type="button" class="routine-primary" data-routine-panel="plan">View daily plan&nbsp;&nbsp; →</button>'}
function routineFeedPct(x){let title=(x[1]||'').toLowerCase(),time=(x[0]||'').toLowerCase();if(/overnight|when hungry|if hungry/.test(time+' '+title))return 'When hungry';if(/top-up|remainder/.test(title))return '20–40%';if(/part 1|part 2/.test(title))return '50%';return '100%'}
function routinePlan(p){return '<div class="routine-plan">'+p.plan.map(function(x){let e=routineEvent(x),pct=e.kind==='feed'?routineFeedPct(x):'';return '<article class="routine-slot"><div class="routine-time">'+esc(x[0])+'</div><span class="routine-event-icon event-'+e.kind+'">'+e.icon+'</span><div><b>'+esc(x[1])+(pct?'<span class="routine-feed-pct">'+esc(pct)+'</span>':'')+'</b><small>'+esc(x[2]||'')+'</small></div>'+(e.kind==='feed'?'<button type="button" class="routine-log" data-routine-log-feed aria-label="Log feed">＋</button>':'<span></span>')+'</article>'}).join('')+'</div>'}
const routineTipCopy={
 'Protect the main anchors rather than chasing every minute.':['Protect the main anchors','Focus on the 07:00 start, lunchtime sleep, 17:00 wake and bedtime.'],
 'For a sleepy feed: feed → wind/change → re-offer.':['For a sleepy feed','Feed, wind or change, then re-offer milk.'],
 'Make 17:00–19:00 the same calm sequence each evening.':['Keep 17:00–19:00 calm','Repeat the same feed, bath and settling sequence each evening.'],
 'Make the late feed a proper feed, not a token dream feed.':['Make the late feed count','Wake Harry enough for a full, effective feed.'],
 'Keep overnight interactions quiet and boring.':['Keep night feeds boring','Use low light, minimal interaction and settle straight back to sleep.'],
 'Protect the lunchtime nap above the other naps.':['Protect the lunchtime nap','Treat this as the main restorative sleep of the day.'],
 'Use the pre-lunch top-up deliberately.':['Use the pre-lunch top-up','Re-offer milk before the main lunchtime nap.'],
 'Extend wake periods gradually, not abruptly.':['Lengthen awake time slowly','Add only a few minutes at a time and watch Harry’s tired cues.'],
 'Wake by 17:00 to protect bedtime.':['Wake by 17:00','This helps preserve a calm bedtime around 19:00.'],

};
function routineTips(p){let icons=['▦','▥','☾','♥','◷','◇'],tones=['tone-mint','tone-sun','tone-moon','tone-alert','event-nap','tone-mint'];return '<h3 class="routine-section-title">Gina’s top tips for this phase</h3><div class="routine-tip-list">'+p.tips.map(function(x,i){let copy=routineTipCopy[x]||[x,'Use this as a calm guide and respond to Harry’s individual needs.'];return '<article class="routine-tip-card"><span class="routine-tip-icon '+tones[i%tones.length]+'">'+icons[i%icons.length]+'</span><div><b>'+esc(copy[0])+'</b><span>'+esc(copy[1])+'</span></div></article>'}).join('')+'</div><div class="routine-do-dont"><div class="routine-mini-card"><h3>Do</h3><ul>'+p.dos.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div><div class="routine-mini-card dont"><h3>Don’t</h3><ul>'+p.donts.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div></div>'}
function routineProblems(p,all){let items=all?routinePhases.flatMap(function(ph){return ph.problems.map(function(x){return {x:x,p:ph}})}):p.problems.map(function(x){return {x:x,p:p}});let seen=new Set();items=items.filter(function(o){let k=o.x[0];if(seen.has(k))return false;seen.add(k);return true});return '<h3 class="routine-section-title">Common problems &amp; practical solutions</h3><div class="routine-problem-list">'+items.map(function(o,i){let pi=routinePhaseIndex(o.p),xi=o.p.problems.indexOf(o.x);return '<button type="button" class="routine-problem-btn" data-routine-problem="'+pi+':'+xi+'"><span><b>'+esc(o.x[0])+'</b><span>'+esc(o.x[1])+'</span></span><i>⌄</i></button>'}).join('')+'</div>'}
function routineCauses(title){let t=title.toLowerCase();if(/hungr|feed|growth/.test(t))return ['A growth spurt or an incomplete earlier feed.','The feed split or late feed may not have provided enough milk.'];if(/nap|sleep|wake|wide awake|night/.test(t))return ['Overtiredness or too much sleep at another point in the day.','The preceding awake window or wind-down may need a small adjustment.'];if(/evening|bedtime|settling/.test(t))return ['Hunger, trapped wind or overtiredness.','The final nap may have been too short, too long or too late.'];return ['Normal developmental variation at this age.','Hunger, wind, temperature or tiredness may be contributing.']}
function routineProblemDetail(){let pi=routineProblem&&routineProblem.pi,xi=routineProblem&&routineProblem.xi,p=routinePhases[pi],x=p&&p.problems[xi];if(!x)return routineHome();let causes=routineCauses(x[0]),steps=[['Start with the immediate need',x[1]],['Review the previous sleep and feed','Check hunger, wind, nappy, temperature and how the preceding nap or feed went.'],['Make one small adjustment','Move the wind-down or transition by 5–15 minutes rather than changing the whole day.'],['Return to the next anchor','Keep the routine consistent while responding to clear hunger and tiredness.']];return routinePageBar(x[0],'problems')+'<div class="routine-problem-alert"><span class="routine-alert-icon">!</span><span>This is common at this stage. Work through the likely causes, then make one small change at a time.</span></div><section class="routine-detail-section"><h3>Why it happens</h3><p>There may be more than one cause:</p><ul>'+causes.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ul></section><section class="routine-detail-section"><h3>How to fix it</h3>'+steps.map(function(s,i){return '<div class="routine-fix"><i>'+(i+1)+'</i><div><b>'+esc(s[0])+'</b><span>'+esc(s[1])+'</span></div></div>'}).join('')+'</section><div class="routine-principle"><span class="routine-phase-icon tone-mint" style="width:28px;height:28px;font-size:14px">♥</span><div><b>Gina’s principle</b><span>“A well-fed, well-rested baby will settle.”</span></div></div>'}
function routinePhasePage(p){let i=routinePhaseIndex(p),m=routineMeta[i],body=routinePanel==='overview'?routineOverview(p):routinePanel==='plan'?routinePlan(p):routinePanel==='tips'?routineTips(p):routineProblems(p,false);return routinePageBar(p.weeks,'home')+'<div class="routine-intro"><span class="routine-phase-icon '+m.tone+'">'+m.icon+'</span><div><h3>'+esc(p.objective)+'</h3><p>'+esc(p.summary)+'</p></div></div>'+routineTabs()+body}
function routineHtml(){if(routineScreen==='problem')return routineProblemDetail();if(routineScreen==='common')return routinePageBar('Common Problems','home')+routineProblems(routinePhase(routineWeek),true);if(routineScreen==='phase')return routinePhasePage(routinePhase(routineWeek));return routineHome()}
function bindRoutine(){document.querySelectorAll('[data-routine-phase]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.routinePhase);routineWeek=routinePhases[i].weekSet[0];routinePanel='overview';routineScreen='phase';renderRoutine()});document.querySelectorAll('[data-routine-panel]').forEach(b=>b.onclick=()=>{routinePanel=b.dataset.routinePanel;routineScreen='phase';renderRoutine()});document.querySelectorAll('[data-routine-back]').forEach(b=>b.onclick=()=>{let to=b.dataset.routineBack;if(to==='problems'){routineScreen='phase';routinePanel='problems'}else routineScreen='home';renderRoutine()});document.querySelectorAll('[data-routine-common]').forEach(b=>b.onclick=()=>{routineScreen='common';renderRoutine()});document.querySelectorAll('[data-routine-problem]').forEach(b=>b.onclick=()=>{let a=b.dataset.routineProblem.split(':').map(Number);routineProblem={pi:a[0],xi:a[1]};routineScreen='problem';renderRoutine()});document.querySelectorAll('[data-routine-log-feed]').forEach(b=>b.onclick=()=>open('feed'));document.querySelectorAll('[data-routine-favourite]').forEach(b=>b.onclick=()=>{let on=localStorage.getItem('harry-routine-favourite-v1')==='1';localStorage.setItem('harry-routine-favourite-v1',on?'0':'1');renderRoutine()})}
function renderRoutine(){let el=$('routine');if(!el)return;el.innerHTML=routineHtml();bindRoutine()}
const _routineSetView=setView;setView=function(v){_routineSetView(v);let el=$('routine'),h=$('hero');if(el)el.classList.toggle('hide',v!=='routine');if(h)h.classList.toggle('routine-mode',v==='routine');if(v==='routine'){if(h)h.classList.add('history-photo');setHeroPhoto('harry-history').catch(()=>{});$('title').textContent='Routine';$('date').textContent='Birth to 8 weeks';routineScreen='home';renderRoutine()}else if(v!=='history'&&v!=='techniques'){if(h)h.classList.remove('history-photo')}};
